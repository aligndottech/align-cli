name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Enterprise policy blocks the default GITHUB_TOKEN from opening PRs, so
      # mint a token from the release-bot GitHub App (Contents + PRs: write).
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When a Release PR is merged, release-please cuts the GitHub release and this
  # job publishes to npm (provenance-signed, public).
  #
  # ALI-797: every release is BORN STAGED. The GitHub release is created as a
  # prerelease (release-please-config.json `prerelease: true`), so
  # `releases/latest/download` - the default install.sh path - keeps serving the
  # previous stable; npm publishes under the `next` dist-tag, so plain
  # `npm i -g @aligndottech/cli` keeps resolving the previous `latest`. The E2E
  # workflow (e2e-release.yml) then tests the staged artifacts on fresh runners,
  # and promote-release.yml ships the IDENTICAL bytes: never test what you didn't
  # ship, never ship what you didn't test. Full runbook: docs/RELEASING.md.
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor from package.json engines. Publishing from a Node older than the
          # package supports would typecheck and test against a runtime no user has.
          node-version: '22.16'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # --tag next: the staging half of ALI-797's contract (see the job comment).
      # Promotion to `latest` is one `npm dist-tag add` in promote-release.yml -
      # the same tarball, no rebuild.
      - name: Publish to the next dist-tag
        run: npm publish --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Standalone binaries, attached to the GitHub release (ALI-740).
  #
  # `npm install -g` needs a Node toolchain on the user's machine; a binary needs
  # nothing. Every target cross-compiles from this one runner because the local graph
  # has no native addon - see scripts/build-binaries.sh for what that cost.
  #
  # Independent of `publish` on purpose: npm and the binaries are two distribution
  # channels, and a registry hiccup must not cost the binaries, or the reverse.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write # upload release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
          cache: 'npm'

      - run: npm ci

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0' # pinned: this is the runtime we ship inside the binary

      - name: Build every target
        run: bash scripts/build-binaries.sh

      # The tag is what decides WHERE these land. An empty one would make `gh release
      # upload` fail confusingly, or worse, target the wrong release - so read it and
      # stop, rather than passing an empty string down the pipe.
      - name: Check the release tag resolved
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "FATAL: release-please reported a release but produced no tag_name."
            echo "       Refusing to guess which release these binaries belong to."
            exit 1
          fi
          echo "uploading to $TAG"

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist-bin/* --clobber

      # Verify the EFFECT, not the exit code of the upload. `gh release upload` can
      # succeed per-file; what matters is that the release now carries every asset a
      # user's install line can ask for.
      - name: Verify every asset is on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          listed="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$listed"
          missing=0
          for f in dist-bin/*; do
            name="$(basename "$f")"
            printf '%s\n' "$listed" | grep -qx "$name" || { echo "MISSING: $name"; missing=1; }
          done
          [ "$missing" -eq 0 ] || { echo "FATAL: the release is missing assets listed above"; exit 1; }
          echo "all $(ls dist-bin | wc -l | tr -d ' ') assets present on $TAG"
