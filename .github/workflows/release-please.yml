name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Enterprise policy blocks the default GITHUB_TOKEN from opening PRs, so
      # mint a token from the release-bot GitHub App (Contents + PRs: write).
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When a Release PR is merged, release-please cuts the GitHub release and this
  # job publishes to npm (provenance-signed, public).
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor from package.json engines. Publishing from a Node older than the
          # package supports would typecheck and test against a runtime no user has.
          node-version: '22.16'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Standalone binaries, attached to the GitHub release (ALI-740).
  #
  # `npm install -g` needs a Node toolchain on the user's machine; a binary needs
  # nothing. Every target cross-compiles from this one runner because the local graph
  # has no native addon - see scripts/build-binaries.sh for what that cost.
  #
  # Independent of `publish` on purpose: npm and the binaries are two distribution
  # channels, and a registry hiccup must not cost the binaries, or the reverse.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write # upload release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
          cache: 'npm'

      - run: npm ci

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0' # pinned: this is the runtime we ship inside the binary

      - name: Build every target
        run: bash scripts/build-binaries.sh

      # The tag is what decides WHERE these land. An empty one would make `gh release
      # upload` fail confusingly, or worse, target the wrong release - so read it and
      # stop, rather than passing an empty string down the pipe.
      - name: Check the release tag resolved
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "FATAL: release-please reported a release but produced no tag_name."
            echo "       Refusing to guess which release these binaries belong to."
            exit 1
          fi
          echo "uploading to $TAG"

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist-bin/* --clobber

      # Verify the EFFECT, not the exit code of the upload. `gh release upload` can
      # succeed per-file; what matters is that the release now carries every asset a
      # user's install line can ask for.
      - name: Verify every asset is on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          listed="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$listed"
          missing=0
          for f in dist-bin/*; do
            name="$(basename "$f")"
            printf '%s\n' "$listed" | grep -qx "$name" || { echo "MISSING: $name"; missing=1; }
          done
          [ "$missing" -eq 0 ] || { echo "FATAL: the release is missing assets listed above"; exit 1; }
          echo "all $(ls dist-bin | wc -l | tr -d ' ') assets present on $TAG"

  # Republish the record at registry.modelcontextprotocol.io after every npm
  # release, so the registry never describes a version npm does not have
  # (ALI-535). Runs after `publish` because the registry validates `mcpName`
  # against the LIVE npm record - publishing first would fail validation.
  # OIDC login binds the token to the io.github.aligndottech/* namespace, so
  # there is no registry secret to store or rotate.
  mcp-registry:
    needs: [release-please, publish]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to the MCP registry
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Pinned version + checksum, not releases/latest: this runs in the
      # RELEASE workflow, and an unpinned latest means a changed or compromised
      # upstream asset executes here with our OIDC identity. The hash was
      # verified against an independent download of the pinned artifact, not
      # copied from the checksums file alone. Bumping the version means
      # updating both lines - deliberately, that is the point.
      - name: Install mcp-publisher (pinned + checksum-verified)
        run: |
          MCP_PUBLISHER_VERSION="v1.8.1"
          MCP_PUBLISHER_SHA256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          curl -sSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Login to the MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: |
          # npm metadata can lag `npm publish` by a few seconds, and the
          # registry reads it to check mcpName - retry rather than fail the
          # release on propagation delay.
          n=0
          until ./mcp-publisher publish; do
            n=$((n+1))
            [ "$n" -ge 3 ] && { echo "registry publish failed after $n attempts"; exit 1; }
            sleep 30
          done
