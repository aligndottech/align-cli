name: mac-probe
on:
  pull_request:
    paths: ['.github/workflows/mac-probe.yml']
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: keychain
        shell: bash
        run: |
          set +e
          security create-keychain -p ci-pass align-ci.keychain
          security list-keychains -d user -s align-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s align-ci.keychain
          security unlock-keychain -p ci-pass align-ci.keychain
          security set-keychain-settings -t 3600 align-ci.keychain
          security list-keychains
          cat > /tmp/p.cjs <<'JS'
          const { spawnSync, spawn } = require('node:child_process');
          const line = (a) => `add-generic-password -U -a "${a}" -s "align-cli" -X 6162\n`;
          const show = (n, r) => console.log(n, 'status=' + r.status, 'err=' + (r.error && r.error.code), 'stderr=' + JSON.stringify(String(r.stderr || '').slice(0, 200)));
          show('A spawnSync pipe', spawnSync('/usr/bin/security', ['-i'], { input: line('pa'), encoding: 'utf8', timeout: 8000 }));
          show('B spawnSync stdout/stderr inherit', spawnSync('/usr/bin/security', ['-i'], { input: line('pb'), stdio: ['pipe', 'inherit', 'inherit'], timeout: 8000 }));
          show('C spawnSync stdout ignore', spawnSync('/usr/bin/security', ['-i'], { input: line('pc'), stdio: ['pipe', 'ignore', 'pipe'], encoding: 'utf8', timeout: 8000 }));
          const c = spawn('/usr/bin/security', ['-i'], { stdio: ['pipe', 'pipe', 'pipe'] });
          let out = ''; c.stdout.on('data', (d) => { out += d; }); c.stderr.on('data', (d) => { out += d; });
          c.stdin.end(line('pd'));
          const timer = setTimeout(() => { console.log('D async: TIMEOUT', JSON.stringify(out.slice(0, 200))); c.kill(); }, 8000);
          c.on('close', (code) => { clearTimeout(timer); console.log('D async close code=' + code, JSON.stringify(out.slice(0, 200))); });
          JS
          sed -i 's/^          //' /tmp/p.cjs
          node /tmp/p.cjs
          for a in pa pb pc pd; do echo "find $a:"; security find-generic-password -a $a -s align-cli -w; echo "rc=$?"; done
