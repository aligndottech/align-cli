name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job name MUST stay "test" - main's branch protection requires the "test" context.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor from package.json engines, not the newest runtime: this is the
          # version a user on the oldest supported Node actually gets. 22.16 is where
          # node:sqlite is unflagged AND DatabaseSync.isTransaction exists (ALI-740).
          node-version: '22.16'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test + coverage (enforces thresholds)
        run: npm run test:coverage

      # Guards for the smoke harness itself, which vitest cannot reach: it is a shell script
      # plus a Node runner. They exist because the runner's win32 argv-quoting precondition was
      # documented and unenforced, and a step that broke it was misdiagnosed as a product defect
      # for two rounds. Runs in this job because it is the one with Node available.
      - name: Smoke harness guards
        run: bash scripts/__tests__/test-smoke-timeout.sh

      # The other half of the smoke harness: where the embedding model caches, and the
      # predicate that decides a failed step is huggingface.co rate-limiting us rather than
      # our defect. That one turns a red gate into a warning, so it is a tested function
      # rather than a grep - most of its cases are negative controls (404, 503, a 429 from
      # another host) proving it refuses everything except the one thing it is for.
      - name: Smoke model guards
        run: bash scripts/__tests__/test-smoke-model.sh

      # install.sh and scripts/build-binaries.sh are two writers of one fact - the asset
      # names. A rename on either side 404s every install line in the README at once, with
      # nothing red until a stranger runs it. This derives both sets and compares them, and
      # exercises install.sh end to end against a local file:// release including a
      # deliberately corrupted download (ALI-740).
      - name: Install-asset parity + installer behaviour
        run: bash scripts/__tests__/test-install-assets.sh

      # And the guard that keeps the two steps above honest: each shell suite is wired to CI
      # by hand, on its own run: line, so forgetting one is a single missing line that nothing
      # reports. An unrun test passes locally and gates nothing - the failure mode is silence
      # (ALI-714). Its own tests run first, because a broken guard reports a clean tree.
      - name: Shell-suite runner guards
        run: bash scripts/__tests__/test-check-test-runners.sh

      - name: Every shell suite has a runner
        run: bash scripts/check-test-runners.sh

      - name: Build
        run: npm run build

  # Cross-platform: prove a fresh install, tests (exercise the local DB), build, and
  # the CLI binary all run on Windows + macOS. Kept separate so the required "test"
  # context stays ubuntu-only.
  #
  # This matrix used to pin windows-2022 because `better-sqlite3` shipped no win32
  # prebuild for the Node ABI in use, so `npm ci` compiled it through node-gyp, and
  # node-gyp could not detect the Visual Studio on `windows-latest`. ALI-740 moved the
  # local DB to `node:sqlite`, so there is no native build on any platform any more and
  # the pin has no subject. Unpinned deliberately rather than left with a comment that
  # no longer describes anything.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
          cache: 'npm'

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke - CLI binary runs
        run: node dist/index.js --version

  # Same gate on the newest Node (not a required context). 22.16 is the floor and the
  # required `test` job covers it, so the value here is the OTHER end of the range.
  test-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test + coverage (enforces thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # Binary build + smoke (ALI-740). Every target is cross-compiled from ONE runner,
  # which is only possible because the local graph has no native addon any more - see
  # scripts/build-binaries.sh for the two ways this failed before `node:sqlite`.
  #
  # Building all 8 here rather than only the host one is the point: a target that stops
  # compiling should fail on the PR that breaks it, not during a release. The smoke then
  # runs the host binary, because `align --version` exits 0 on a binary whose first DB
  # call dies, and that false green was believed once already.
  #
  # NOT a required context yet - same reasoning as install-smoke below: prove it stable
  # first. A flaky required gate teaches everyone to ignore red.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node is not needed to BUILD the binary. It is needed by the smoke, which reads
      # the SQLite file back with node:sqlite - a separate process with no CLI code in
      # it, so the schema assertions do not trust the writer.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'   # pinned: a Bun bump changes the runtime we ship

      - run: npm ci

      # The ~23MB embedding model is fetched from huggingface.co the first time the binary
      # embeds anything, and huggingface rate-limits shared runner IPs. Caching keeps that
      # off the critical path; smoke-binary.sh still reports a 429 as SKIP rather than FAIL,
      # so a throttled run is survivable either way. Keyed on the model and the dtype pin,
      # which is what decides which files are fetched. Bump -v1 to discard a bad cache.
      - name: Restore the embedding model
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: .hf-model-cache
          key: align-binary-model-${{ runner.os }}-Xenova-all-MiniLM-L6-v2-q8-v1

      - name: Build every target
        run: bash scripts/build-binaries.sh

      # Builds all 8; smokes the host one. `align --version` exits 0 on a binary whose first
      # DB call dies AND on one that embeds nothing, so this drives a real import and asserts
      # vectors landed on disk.
      - name: Smoke the host binary
        env:
          ALIGN_SMOKE_MODEL_CACHE: .hf-model-cache
        run: bash scripts/smoke-binary.sh

      - name: Save the embedding model
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .hf-model-cache
          key: align-binary-model-${{ runner.os }}-Xenova-all-MiniLM-L6-v2-q8-v1

      - name: Sizes
        run: ls -lh dist-bin/

  # Install smoke: become the user. Packs the real tarball, installs it globally
  # into a clean prefix, and runs the cold no-account first-run sequence
  # (setup --local, import git, search, mcp --setup, a real MCP stdio handshake),
  # asserting exit codes. This crosses the four layers the unit suite never sees:
  # the tsc output in dist/, the package.json "files" list, the optional install
  # (@huggingface/transformers, still native), and Commander's argv parsing -
  # ALI-422 lived in that last one with every test green.
  #
  # The OS x Node matrix is the whole point: the optional native install is the only
  # part of the CLI whose answer differs by platform, and it is exactly the part
  # no laptop can test for anyone else's machine. (The local DB no longer differs -
  # ALI-740 moved it to node:sqlite - which is why windows is unpinned above.)
  #
  # NOT a required context yet - prove it stable first, then add it to branch
  # protection (a gate is only real once something requires it, but a flaky
  # required gate teaches everyone to ignore red).
  install-smoke:
    permissions:
      contents: read  # CodeQL: the job only checks out and runs; never let the default token write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
        include:
          # ONE leg never restores the model cache, so the real download from
          # huggingface.co is still exercised on every run. A cache covering all nine legs
          # would remove the network from the gate by removing the thing it tests: after
          # the first save nothing would ever fetch the model again, and the day the
          # download broke, every leg would be green. This adds a key to the existing
          # ubuntu/22 combination rather than creating a tenth job.
          - os: ubuntu-latest
            node: '22'
            cold_model: 'true'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # ALI-713: the ~23MB embedding model is fetched from huggingface.co on first use, and
      # huggingface rate-limits shared runner IPs. One 429 failed four steps of a PR that
      # touched nothing near the model path, and a re-run passed with no code change - an
      # unattributable red whose only remedy is to notice it is not yours, which is the same
      # reading that excuses a real failure. Caching removes the network from eight legs.
      #
      # Keyed on the model and the dtype pin, because those decide which files are fetched
      # (q8 -> model_quantized.onnx; see local-embeddings.ts, where the pin is load-bearing
      # for vector compatibility). Bump -v1 to discard a bad cache.
      #
      # The path is a bare relative name on purpose: the smoke script resolves it against the
      # repo root, so no Windows `D:\a\...` path has to survive Git Bash.
      - name: Restore the local embedding model
        id: model-cache
        if: matrix.cold_model != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .hf-model-cache
          key: align-hf-model-${{ runner.os }}-Xenova-all-MiniLM-L6-v2-q8-v1

      - run: npm ci

      - run: npm run build

      - name: Pack, install globally, run the cold first-run sequence
        shell: bash
        env:
          # Empty on the cold leg, which is what makes it cold. Written in this direction
          # deliberately: `cold_model == 'true' && '' || '.hf-model-cache'` reads correctly and
          # is WRONG, because '' is falsy in a GitHub expression, so the `||` branch wins and
          # the cold leg would silently be warm - the DoD's "a cold run still exercises the
          # model path" quietly unmet with nothing in the log to say so. The truthy value has
          # to be on the left of the `||`.
          ALIGN_SMOKE_MODEL_CACHE: ${{ matrix.cold_model != 'true' && '.hf-model-cache' || '' }}
        run: bash scripts/smoke-install.sh

      # Restore/save split rather than plain actions/cache, so exactly ONE node leg per OS
      # writes the entry. The three legs share a key, so with the combined action the other
      # two race and lose, logging "Failed to save: Unable to reserve cache" - measured on
      # this PR's first run. It is harmless and it reads exactly like a broken cache, which
      # is how a log line teaches people to stop looking. node 24 is the saver everywhere
      # (ubuntu's 22 is the cold leg and has no cache at all).
      #
      # The saver MUST NOT be the cold leg's version, or the cold leg both skips the restore
      # and writes the cache, and there is nothing in the log to say the gate lost its only
      # real download. It moved 20 -> 24 with the matrix (ALI-740).
      #
      # The directory can legitimately be absent: smoke-install.sh refuses to write it after
      # a 429, after any failure, or with no weights on disk, and that run must stay green.
      - name: Was a model cache produced?
        id: model-cache-state
        if: matrix.cold_model != 'true' && matrix.node == '24'
        shell: bash
        run: |
          if [ -d .hf-model-cache ] && [ -n "$(ls -A .hf-model-cache 2>/dev/null)" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Save the local embedding model
        if: >-
          matrix.cold_model != 'true' && matrix.node == '24'
          && steps.model-cache.outputs.cache-hit != 'true'
          && steps.model-cache-state.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: .hf-model-cache
          key: align-hf-model-${{ runner.os }}-Xenova-all-MiniLM-L6-v2-q8-v1
