name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job name MUST stay "test" - main's branch protection requires the "test" context.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test + coverage (enforces thresholds)
        run: npm run test:coverage

      # Guards for the smoke harness itself, which vitest cannot reach: it is a shell script
      # plus a Node runner. They exist because the runner's win32 argv-quoting precondition was
      # documented and unenforced, and a step that broke it was misdiagnosed as a product defect
      # for two rounds. Runs in this job because it is the one with Node available.
      - name: Smoke harness guards
        run: bash scripts/__tests__/test-smoke-timeout.sh

      # The other half of the smoke harness: where the embedding model caches, and the
      # predicate that decides a failed step is huggingface.co rate-limiting us rather than
      # our defect. That one turns a red gate into a warning, so it is a tested function
      # rather than a grep - most of its cases are negative controls (404, 503, a 429 from
      # another host) proving it refuses everything except the one thing it is for.
      - name: Smoke model guards
        run: bash scripts/__tests__/test-smoke-model.sh

      - name: Build
        run: npm run build

  # Cross-platform: prove a fresh install (native deps build/prebuild), tests
  # (exercise better-sqlite3 + the local DB), build, and the CLI binary all run on
  # Windows + macOS. Kept separate so the required "test" context stays ubuntu-only.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        # Pin Windows to 2022: `better-sqlite3` ships no win32 prebuild for this
        # Node ABI, so `npm ci` compiles it via node-gyp - and node-gyp (bundled
        # with Node 20) cannot detect the newer Visual Studio on `windows-latest`
        # ("unknown version undefined at ...Visual Studio\18"). windows-2022 has
        # a VS 2022 node-gyp recognises, so the native build succeeds.
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke - CLI binary runs
        run: node dist/index.js --version

  # Same gate on Node 22 (not a required context, runs for coverage of the newer runtime).
  test-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test + coverage (enforces thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # Install smoke: become the user. Packs the real tarball, installs it globally
  # into a clean prefix, and runs the cold no-account first-run sequence
  # (setup --local, import git, search, mcp --setup, a real MCP stdio handshake),
  # asserting exit codes. This crosses the four layers the unit suite never sees:
  # the tsc output in dist/, the package.json "files" list, the native install
  # (better-sqlite3 + optional transformers), and Commander's argv parsing -
  # ALI-422 lived in that last one with every test green.
  #
  # The OS x Node matrix is the whole point: the native-build step is the only
  # part of the CLI whose answer differs by platform, and it is exactly the part
  # no laptop can test for anyone else's machine. windows-2022 for the same
  # node-gyp/VS reason documented on cross-platform above.
  #
  # NOT a required context yet - prove it stable first, then add it to branch
  # protection (a gate is only real once something requires it, but a flaky
  # required gate teaches everyone to ignore red).
  install-smoke:
    permissions:
      contents: read  # CodeQL: the job only checks out and runs; never let the default token write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        node: ['20', '22', '24']
        include:
          # ONE leg never restores the model cache, so the real download from
          # huggingface.co is still exercised on every run. A cache covering all nine legs
          # would remove the network from the gate by removing the thing it tests: after
          # the first save nothing would ever fetch the model again, and the day the
          # download broke, every leg would be green. This adds a key to the existing
          # ubuntu/22 combination rather than creating a tenth job.
          - os: ubuntu-latest
            node: '22'
            cold_model: 'true'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # ALI-713: the ~23MB embedding model is fetched from huggingface.co on first use, and
      # huggingface rate-limits shared runner IPs. One 429 failed four steps of a PR that
      # touched nothing near the model path, and a re-run passed with no code change - an
      # unattributable red whose only remedy is to notice it is not yours, which is the same
      # reading that excuses a real failure. Caching removes the network from eight legs.
      #
      # Keyed on the model and the dtype pin, because those decide which files are fetched
      # (q8 -> model_quantized.onnx; see local-embeddings.ts, where the pin is load-bearing
      # for vector compatibility). Bump -v1 to discard a bad cache.
      #
      # The path is a bare relative name on purpose: the smoke script resolves it against the
      # repo root, so no Windows `D:\a\...` path has to survive Git Bash.
      - name: Cache the local embedding model
        if: matrix.cold_model != 'true'
        uses: actions/cache@v4
        with:
          path: .hf-model-cache
          key: align-hf-model-${{ runner.os }}-Xenova-all-MiniLM-L6-v2-q8-v1

      - run: npm ci

      - run: npm run build

      - name: Pack, install globally, run the cold first-run sequence
        shell: bash
        env:
          # Empty on the cold leg, which is what makes it cold. Written in this direction
          # deliberately: `cold_model == 'true' && '' || '.hf-model-cache'` reads correctly and
          # is WRONG, because '' is falsy in a GitHub expression, so the `||` branch wins and
          # the cold leg would silently be warm - the DoD's "a cold run still exercises the
          # model path" quietly unmet with nothing in the log to say so. The truthy value has
          # to be on the left of the `||`.
          ALIGN_SMOKE_MODEL_CACHE: ${{ matrix.cold_model != 'true' && '.hf-model-cache' || '' }}
        run: bash scripts/smoke-install.sh
