# ALI-797: promotion is the ONLY step that makes a release public, and it ships the
# identical bytes the E2E and the human pass tested - one dist-tag move and one
# prerelease flag flip, no rebuild anywhere. Runbook: docs/RELEASING.md.
#
# Auto-promotion (added after cli-v0.36.0 sat un-promoted on `next` for 4 days because the
# manual step was forgotten): the workflow_run trigger fires this same job automatically
# when e2e-release.yml finishes. It is scoped to `github.event.workflow_run.event ==
# 'release'` - the trigger of the UPSTREAM e2e run, not this workflow's own - so it only
# ever fires for the E2E run release-please's own fresh prerelease kicks off, never a
# manual `workflow_dispatch` re-run of e2e-release.yml against an older tag. Without that
# distinction, re-testing e.g. cli-v0.34.0 by hand for debugging would auto-promote it over
# a newer release already live - the "Refuse to promote older" step below is the second,
# independent guard against exactly that, in case the event-source scoping is ever loosened.
#
# This removes the SEPARATE MANUAL "human pass" step from the release gate (docs/RELEASING.md
# step 3 - "necessary, not sufficient" alongside the E2E matrix). That tradeoff was accepted
# deliberately: the human pass is Tom, promotion had no other operator, and the 4-day gap this
# fixes was long enough that some tags would go untested by a human indefinitely anyway. A
# human can still do the pass before or after promotion; it is no longer what unblocks it.
name: Promote Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote (e.g. cli-v0.31.0)'
        required: true
      force:
        description: 'Promote even if the E2E run for this tag is not green (break-glass only - say why in the run)'
        type: boolean
        default: false
  workflow_run:
    workflows: ['E2E Release']
    types: [completed]

permissions:
  contents: write # flip prerelease -> latest on the release
  id-token: write # npm provenance-adjacent + MCP registry OIDC login
  actions: read # read the E2E run conclusion for the gate

jobs:
  # One place that decides WHICH tag this run is about and whether it should proceed at
  # all - every step after this reads `needs.resolve.outputs.*`, never `inputs.*` or
  # `github.event.workflow_run.*` directly, so there is exactly one spot where the two
  # trigger shapes are reconciled.
  resolve:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      force: ${{ steps.resolve.outputs.force }}
    steps:
      - name: Resolve the tag to promote
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FORCE: ${{ inputs.force }}
          # e2e-release.yml's own `run-name:` is "E2E ${tag}" - the same string
          # promote-release.yml's manual gate below already matches against via
          # `displayTitle | contains($TAG)`, so this is a second reader of an existing
          # contract rather than a new one.
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            force="$INPUT_FORCE"
          else
            tag="${RUN_TITLE#E2E }"
            force="false"
          fi
          if [ -z "$tag" ] || [ "$tag" = "$RUN_TITLE" ]; then
            echo "FATAL: could not resolve a release tag from event=$EVENT_NAME title='$RUN_TITLE'"
            exit 1
          fi
          echo "Resolved tag=$tag force=$force from event=$EVENT_NAME"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

  promote:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gate: a promotion without a green E2E for THIS tag is refused, because an
      # unexercised promote is exactly the "ship what you didn't test" this pipeline
      # exists to prevent. `force` exists for a broken E2E harness, not a red one. Always
      # runs for the auto-promote path too - the workflow_run trigger already implies a
      # success, but reading it back here keeps this step meaningful on its own rather
      # than trusting a value threaded three jobs upstream.
      - name: Require a green E2E run for this tag
        if: ${{ needs.resolve.outputs.force != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          conclusion="$(gh run list --workflow=e2e-release.yml --json conclusion,displayTitle \
            --jq "[.[] | select(.displayTitle | contains(\"$TAG\"))][0].conclusion // \"absent\"")"
          echo "e2e for $TAG: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "FATAL: the most recent E2E run for $TAG is '$conclusion', not success."
            echo "       Fix the release (or the harness) and re-run e2e-release.yml first."
            echo "       force=true overrides - break-glass only."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
          registry-url: 'https://registry.npmjs.org'

      # cli-vX.Y.Z -> X.Y.Z. Derived here once; an empty result stops the job before
      # any mutation, rather than dist-tagging an empty string.
      - name: Resolve the version from the tag
        id: ver
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          version="${TAG#cli-v}"
          if [ -z "$version" ] || [ "$version" = "$TAG" ]; then
            echo "FATAL: tag '$TAG' does not look like cli-vX.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Defense in depth for the auto-promote path, independent of the event-source
      # scoping on the `resolve` job's `if:`: refuse to move `latest` BACKWARDS. Checked
      # here rather than assumed, the same "assert the effect" discipline the verify step
      # below already applies to the writes themselves.
      - name: Refuse to promote a version older than what is already latest
        run: |
          current="$(npm view @aligndottech/cli dist-tags.latest)"
          target="${{ steps.ver.outputs.version }}"
          newest="$(printf '%s\n%s\n' "$current" "$target" | sort -V | tail -1)"
          if [ "$newest" != "$target" ] && [ "$current" != "$target" ]; then
            echo "FATAL: current latest ($current) is newer than the target ($target) - refusing to downgrade."
            exit 1
          fi

      # The whole npm promotion: the tarball tested under `next` becomes `latest`.
      - name: Promote the npm dist-tag
        run: npm dist-tag add "@aligndottech/cli@${{ steps.ver.outputs.version }}" latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The whole GitHub promotion: releases/latest/download (install.sh's default
      # path) now serves this release's assets - the same files the E2E installed.
      - name: Flip the release from prerelease to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.resolve.outputs.tag }}" --prerelease=false --latest

      # Verify the EFFECT of both promotions, not the commands' exit codes.
      #
      # npm's registry write and its read path are not the same store - `npm dist-tag add`
      # returning 0 means the write was accepted, not that a read a few hundred ms later sees
      # it (measured on cli-v0.31.2: the add printed "+latest: ...@0.31.2" at T, this check
      # read back 0.31.1 at T+700ms, and `npm view` a minute later already showed 0.31.2 -
      # the promotion was correct throughout, only this check's timing was wrong). Retrying a
      # READ is safe here specifically because nothing about it is a mutation to reorder or
      # double up - unlike the writes above, which stay bare and unretried.
      - name: Verify latest points here on both channels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm_latest=""
          for attempt in 1 2 3 4 5; do
            npm_latest="$(npm view @aligndottech/cli dist-tags.latest)"
            [ "$npm_latest" = "${{ steps.ver.outputs.version }}" ] && break
            if [ "$attempt" -lt 5 ]; then
              echo "npm latest is $npm_latest (attempt $attempt/5, want ${{ steps.ver.outputs.version }}) - retrying"
              sleep 5
            fi
          done
          [ "$npm_latest" = "${{ steps.ver.outputs.version }}" ] || {
            echo "FATAL: npm latest is $npm_latest after 5 attempts, expected ${{ steps.ver.outputs.version }}"; exit 1; }
          gh_latest="$(gh release view --json tagName --jq .tagName)"
          [ "$gh_latest" = "${{ needs.resolve.outputs.tag }}" ] || {
            echo "FATAL: GitHub latest release is $gh_latest, expected ${{ needs.resolve.outputs.tag }}"; exit 1; }
          echo "latest = ${{ needs.resolve.outputs.tag }} on npm and GitHub"

  # Moved here from release-please.yml (ALI-797): the MCP registry should describe the
  # version a stranger actually gets, which is only true after promotion. Everything
  # below is the previous job verbatim, pinned publisher included.
  mcp-registry:
    needs: [resolve, promote]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to the MCP registry
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }} # server.json must be the promoted version's copy

      # Pinned version + checksum, not releases/latest: this runs in the
      # promotion workflow, and an unpinned latest means a changed or compromised
      # upstream asset executes here with our OIDC identity. The hash was
      # verified against an independent download of the pinned artifact, not
      # copied from the checksums file alone. Bumping the version means
      # updating both lines - deliberately, that is the point.
      - name: Install mcp-publisher (pinned + checksum-verified)
        run: |
          MCP_PUBLISHER_VERSION="v1.8.1"
          MCP_PUBLISHER_SHA256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          curl -sSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Login to the MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: |
          # npm metadata can lag by a few seconds, and the registry reads it to
          # check mcpName - retry rather than fail the promotion on propagation delay.
          n=0
          until ./mcp-publisher publish; do
            n=$((n+1))
            [ "$n" -ge 3 ] && { echo "registry publish failed after $n attempts"; exit 1; }
            sleep 30
          done
